<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background circle for favicon context -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle (background for favicon) -->
  <circle cx="128" cy="128" r="128" fill="url(#bgGrad)"/>
  
  <!-- Icon group (centered) -->
  <g transform="translate(128, 128)">
    <!-- Pulse ring 1 (outer, faded) -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.2"/>
    
    <!-- Pulse ring 2 (middle) -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#fb923c" stroke-width="2.5" opacity="0.4"/>
    
    <!-- Center circle (solid orange) -->
    <circle cx="0" cy="0" r="20" fill="#fb923c"/>
    
    <!-- Inner activity dot -->
    <circle cx="0" cy="0" r="8" fill="white"/>
  </g>
  
  <!-- Text: RIC (optional, for logo usage) -->
  <text x="128" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1f2937" letter-spacing="-0.5">RIC</text>
</svg>
